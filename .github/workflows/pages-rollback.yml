name: Pages — rollback or reconcile
on:
  workflow_dispatch:
    inputs:
      package:
        description: Archived pages-<run_id>, probe-original, or recover for a completed pending deployment
        type: string
        required: true
permissions: {}
jobs:
  publish:
    name: publish-${{ github.run_id }}-${{ github.run_attempt }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: pages-production
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_TARGET: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify archives and prepare or reconcile
        id: prepare
        run: python3 scripts/publication.py prepare
      - name: Upload verified static files
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/publish-site
          retention-days: 1
          include-hidden-files: true
      - name: Persist and read back pending
        if: steps.prepare.outputs.ready == 'true'
        run: python3 scripts/publication.py pending
      - name: Publish Pages
        id: deployment
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Confirm the exact deployment and public entry files
        if: steps.prepare.outputs.ready == 'true'
        run: python3 scripts/publication.py confirm
      - name: Clean up expired archives when the queue is idle
        if: steps.prepare.outputs.ready == 'true'
        run: python3 scripts/publication.py cleanup
