name: Map checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify-equivalence:
        description: Compare the previous full importer with cold and warm optimized builds
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: map-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit and importer checks
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Pin current source releases
        run: python scripts/pipeline.py resolve --lock .build/inputs.json
      - uses: ./.github/actions/data
      - name: Build the static application
        run: npm run build
      - name: Compare every file with the previous importer and warm cache
        if: github.event_name == 'workflow_dispatch' && inputs.verify-equivalence
        env:
          BASELINE_SHA: aaae3780372dc55cbcf5268418fff8623f5d4e67
        run: |
          gh api "repos/dlubom/jktz-mapa/contents/scripts/pipeline.py?ref=$BASELINE_SHA" -H 'Accept: application/vnd.github.raw' > .build/reference-pipeline.py
          python scripts/verify_rasters.py --reference-script .build/reference-pipeline.py --lock .build/inputs.json
      - name: Save full equivalence evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify-equivalence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raster-equivalence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/raster-equivalence/
          retention-days: 15
          if-no-files-found: warn
      - name: Browser acceptance on the static build
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browser
      - name: Package and verify the preview
        run: python scripts/preview.py package
      - name: Save reviewable build
        id: preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/preview/
          include-hidden-files: true
          compression-level: 0
          retention-days: 15
          if-no-files-found: error
      - name: Link the complete ZIP and selected-PR preview
        env:
          ARTIFACT_URL: ${{ steps.preview.outputs.artifact-url }}
        run: python scripts/preview.py summary --site .build/preview
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/
          retention-days: 15
          if-no-files-found: warn
